name: CI

# siddhants.com is built and served by Cloudflare Pages, which builds this repo
# on its own when main changes. This workflow does NOT deploy: it exists so a
# type error or a broken link fails somewhere visible, because Cloudflare Pages
# runs none of these checks before publishing.
#
# A red run here does not stop Cloudflare from shipping. Treat a failure as
# "roll back or push a fix", not as "the deploy was blocked".

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          # Kept so CI builds the same HTML Cloudflare publishes. The value that
          # actually reaches production is the one set in the Cloudflare Pages
          # project, not this one.
          PUBLIC_NEWSLETTER_ACTION: ${{ vars.PUBLIC_NEWSLETTER_ACTION }}
      - run: npm run check:links

  # Drafts a Kit broadcast for anything newly marked `newsletter: true`.
  # Drafts only — sending stays a human decision, and an email cannot be unsent.
  # Skipped entirely when KIT_API_KEY is absent.
  #
  # Gated on `check` rather than on a deploy, since the deploy now happens on
  # Cloudflare's side where this workflow cannot see it. The draft may therefore
  # be created a minute or two before the page is live; that is harmless,
  # because nothing is sent until you press send.
  newsletter:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Job-level, because a step's own `env:` is not in scope for that step's
    # own `if:` — the guard below would always see an empty string.
    env:
      KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_NEWSLETTER_ACTION: ${{ vars.PUBLIC_NEWSLETTER_ACTION }}
      - name: Draft broadcasts
        if: env.KIT_API_KEY != ''
        run: node scripts/newsletter.mjs
