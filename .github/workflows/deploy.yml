name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Gate the deploy on type checking. astro check is clean as of this commit, so
  # a new type error fails here rather than shipping. Delete this job (and the
  # `needs: check` below) if it ever gets in the way.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run check:links

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install, build, and upload site
        uses: withastro/action@v3
        with:
          node-version: 24
        env:
          # Repository variable, not a secret — it ends up in the built HTML
          # anyway as the form's action URL.
          PUBLIC_NEWSLETTER_ACTION: ${{ vars.PUBLIC_NEWSLETTER_ACTION }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Drafts a Kit broadcast for anything newly marked `newsletter: true`.
  # Creates drafts only — sending stays a human decision, and an email cannot
  # be unsent. Runs after deploy so the links it mails are already live.
  # Skipped entirely when KIT_API_KEY is absent.
  newsletter:
    needs: deploy
    runs-on: ubuntu-latest
    # Job-level, because a step's own `env:` is not in scope for that step's
    # own `if:` — the guard below would always see an empty string.
    env:
      KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_NEWSLETTER_ACTION: ${{ vars.PUBLIC_NEWSLETTER_ACTION }}
      - name: Draft broadcasts
        if: env.KIT_API_KEY != ''
        run: node scripts/newsletter.mjs
